name: Update contribution snake

on:
  push:
    branches: [main]
    paths: [.github/workflows/contribution-snake.yml]
  schedule:
    - cron: '27 2 * * *'
  workflow_dispatch:

concurrency: contribution-snake

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate animated contribution grids
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%238b5cf6
            dist/snake-dark.svg?palette=github-dark&color_snake=%23a78bfa

      - name: Publish generated SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git init --initial-branch=contribution-snake published
          cd published
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          branch_ref=refs/heads/contribution-snake
          if git ls-remote --exit-code origin "$branch_ref"; then
            git fetch --depth=1 origin "$branch_ref"
            git reset --hard FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          cp ../dist/snake.svg ../dist/snake-dark.svg .
          git add snake.svg snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh contribution snake'
          git push origin "HEAD:$branch_ref"
